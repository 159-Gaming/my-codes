<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moves Ideas</title>
    <style>
        @font-face {
            font-family: 'plau';
            src: url('https://raw.githubusercontent.com/159-Gaming/my-codes/main/fonts/PlauTest-Regular.otf') format('opentype');
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'plau', sans-serif;
        }

        .main-page {
            width: 100%;
            height: 500px;
            background-color: bisque;
            display: flex;
        }

        header {
            width: 100%;
            height: 140px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.200);
            display: flex;
            justify-content: center;
        }

        .logo {
            width: 300px;
            height: 140px;
            position: relative;
        }
        
        .circles {}

        .c1, .c3, .c5, .c7 {
            background-color: rgb(34, 20, 12);
        }

        .c2, .c4, .c6 {
            background-color:bisque;
        }

        .c1 {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .c2 {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            position: absolute;
            top: 12.5px;
            left: 12.5px;
        }

        .c3 {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            position: absolute;
            top: 17.5px;
            left: 17.5px;
        }

        .c4 {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .c5 {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: 25px;
        }

        .c6 {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .c7 {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
        }

        .text-logo {
            display: flex;
            flex-direction: column;
            justify-content:space-around;
            align-items: start;
        }

        .l1 {
            font-size: 50px;
            color: rgb(34, 20, 12);
        }

        .l2 {
            font-size: 30px;
            color: rgb(34, 20, 12);
        }
    </style>
</head>
<body>
    <div class="main-page">
        <div class="header">
            <div class="logo">
                <div class="circles">
                    <div class="c1"></div>
                    <div class="c2"></div>
                    <div class="c3"></div>
                    <div class="c4"></div>
                    <div class="c5"></div>
                    <div class="c6"></div>
                    <div class="c7"></div>
                </div>
                <div class="text-logo">
                    <div class="l1">ROMY KEAN</div>
                    <div class="l2">MOTION DESIGNER</div>
                </div>
            </div>
        </div>
    </div>
    <div class="info"></div>
    <div class="services"></div>
    <div class="skill-and-experience"></div>
    <div class="featured-motion-project"></div>
    <div class="kind-words"></div>
    <div class="get-in-touch"></div>
    <div class="misceleanious-info"></div>
</body>
</html>
