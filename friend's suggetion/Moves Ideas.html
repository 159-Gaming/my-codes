<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moves Ideas</title>
    <style>
        @font-face {
            font-family: 'plau';
            src: url('https://raw.githubusercontent.com/159-Gaming/my-codes/main/fonts/PlauTest-Regular.otf') format('opentype');
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'plau', sans-serif;
        }

        .main-page {
            width: 100%;
            height: 500px;
            background-color: bisque;
            display: flex;
        }

        header {
            width: 100%;
            height: 140px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.200);
            display: flex;
            justify-content: center;
        }

        .logo {
            display: flex;
            width: 350px;
            height: 140px;
            position: relative;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        
        .circles {
            display: flex;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
        }

        .c1, .c3, .c5, .c7 {
            background-color: rgb(34, 20, 12);
        }

        .c2, .c4, .c6 {
            background-color:bisque;
        }

        .c1 {
            width: 80px;
            height: 80px;
            border: 5px solid rgb(34, 20, 12);
            border-radius: 50%;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .c2 {
            width: 65px;
            height: 65px;
            border: 5px solid rgb(34, 20, 12);
            border-radius: 50%;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .c3 {
            width: 40px;
            height: 40px;
            border: 5px solid rgb(34, 20, 12);
            border-radius: 50%;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .c4 {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgb(34, 20, 12);
        }

        .text-logo {
            display: flex;
            flex-direction: column;
            justify-content:space-around;
            left: 100px;
            box-sizing: border-box;
        }

        .l1 {
            font-size: 50px;
            color: rgb(34, 20, 12);
        }

        .l2 {
            font-size: 30px;
            color: rgb(34, 20, 12);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="circles">
                <div class="c1">
                    <div class="c2">
                        <div class="c3">
                            <div class="c4"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-logo">
                <div class="l1">ROMY KEAN</div>
                <div class="l2">MOTION DESIGNER</div>
            </div>
        </div>
        <div id="home">HOME</div>
        <div id="about">ABOUT</div>
        <div id="services">SERVICES</div>
        <div id="work">WPRL</div>
        <div id="experience">EXPERIENCE</div>
        <div id="contact">CONTACT</div>
        <div class="collaborate">
            <div class="text">
                LET'S COLLABORATE
            </div>
        <div class="menu">
            <div class="menu-line"></div>
            <div class="menu-line"></div>
        <div class="menu-line"></div>
    </div>
    <div class="main-page"></div>
    <div class="info"></div>
    <div class="services"></div>
    <div class="skill-and-experience"></div>
    <div class="featured-motion-project"></div>
    <div class="kind-words"></div>
    <div class="get-in-touch"></div>
    <div class="misceleanious-info"></div>
</body>
</html>
