<style>
*{
    box-sizing:border-box;

}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#1a1a1a;
    color:#fff;

}

body{
    display:flex;
}

#sidebar{
    width:16.6667vw;
    min-width:190px;
    height:100vh;
    background:#111;
    border-right:2px solid #00ffff;
    padding:20px;
    display:flex;

}

#sidebar h2{
    margin:0 0 25px;
    padding-bottom:12px;
    border-bottom:1px solid #333;
    color:#00ffff;

    letter-spacing:2px;
    font-size:1rem;
    text-transform:uppercase;
}

.car-btn{
    width:100%;
    margin-bottom:11px;
    padding:14px 11px;
    border:1px solid #444;
    border-radius:7px;
    background:#222;

    cursor:pointer;

}

.car-btn:hover:not(:disabled),

    border-color:#00ffff;

.car-btn:disabled{

}

#fallback-canvas{

    height:100%;

}

#loading-overlay{

    bottom:25px;

    min-width:290px;
    padding:16px 19px;

#loading-title{

    font-size:.78rem;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.progress-wrapper{
    display:flex;

}

#progress-bar-container{
    width:220px;
    height:10px;
    overflow:hidden;
    border:1px solid #00ffff;
    border-radius:5px;
    background:#222;
}

#progress-bar-fill{

    height:100%;
    background:#00ffff;

}

#percentage-text{
    width:45px;
    color:#00ffff;

    font-weight:800;

}

#mobile-help{

    position:absolute;
    bottom:10px;
    left:50%;

    z-index:20;
    padding:5px 9px;
    border-radius:5px;
    background:rgba(0,0,0,.45);

    font-size:10px;

@media(max-width:850px){

        flex-direction:column;

    #sidebar{

    }

    .car-btn{

        width:auto;

        margin:0 4px 0 0;
        padding:9px 7px;
        font-size:.57rem;

    }

    #canvas-container{

        height:calc(100vh - 96px);
    }

    #mobile-help{

    }

    }

    #progress-bar-container{

}

@media(max-width:450px){
    #sidebar{

    }

    #canvas-container{
        height:calc(100vh - 104px);
    }

    .car-btn{
        min-width:82px;
        font-size:.51rem;
    }

        left:50%;
        right:auto;
        transform:translateX(-50%);
    }
}

<script>
"use strict";

/* =========================================================
   DEVICE / PERFORMANCE
========================================================= */

const mobile =
    /Android|iPhone|iPad|iPod|Mobile/i.test(
        navigator.userAgent
    ) ||
    window.innerWidth <= 850;

const PARTICLE_COUNT =
    mobile ? 60000 : 100000;

const FALLBACK_COUNT =
    mobile ? 18000 : 28000;

const SCATTER_SIZE = 100;
const MORPH_DURATION = 2700;
const WHITE_DURATION = 650;

const AQUA = [0,1,1];
const BLACK = [0,0,0];
const YELLOW = [1,.70,0];


/* =========================================================
   DOM
========================================================= */

const container =
    document.getElementById(
        "canvas-container"
    );

const fallbackCanvas =
    document.getElementById(
        "fallback-canvas"
    );

const fallbackCtx =
    fallbackCanvas.getContext(
        "2d"
    );

const loading =
    document.getElementById(
        "loading-overlay"
    );

const progressFill =
    document.getElementById(
        "progress-bar-fill"
    );

const percentage =
    document.getElementById(
        "percentage-text"
    );

const buttons =
    [...document.querySelectorAll(
        ".car-btn"
    )];


/* =========================================================
   GLOBAL STATE
========================================================= */

let mode = "none";

let renderer = null;
let scene = null;
let camera = null;
let controls = null;

let geometry = null;
let material = null;
let particles = null;

let currentPositions = null;
let targetPositions = null;
let currentColors = null;
let targetColors = null;

let currentModel = null;

let generating = false;
let morphing = false;
let whiteStage = false;

let whiteStart = 0;
let morphStart = 0;

let appStart = performance.now();

const cache = {};
const firstSeen = {};


/* =========================================================
   CAR DATA
========================================================= */

const CARS = {

    fortuner:{
        L:9.30,
        W:3.24,
        roof:3.48,
        body:1.70,
        hood:1.66,
        frontCabin:.95,
        rearCabin:-1.72,
        wheelR:.82,
        frontWheel:2.72,
        rearWheel:-2.72,
        style:"fortuner"
    },

    legender:{
        L:9.36,
        W:3.22,
        roof:3.38,
        body:1.66,
        hood:1.63,
        frontCabin:.98,
        rearCabin:-1.67,
        wheelR:.81,
        frontWheel:2.74,
        rearWheel:-2.72,
        style:"legender"
    },

    lc300:{
        L:9.52,
        W:3.36,
        roof:3.52,
        body:1.78,
        hood:1.76,
        frontCabin:1.08,
        rearCabin:-1.79,
        wheelR:.85,
        frontWheel:2.78,
        rearWheel:-2.79,
        style:"lc300"
    },

    innova_crysta:{
        L:9.05,
        W:3.14,
        roof:3.18,
        body:1.60,
        hood:1.55,
        frontCabin:1.25,
        rearCabin:-2.00,
        wheelR:.76,
        frontWheel:2.55,
        rearWheel:-2.56,
        style:"crysta"
    },

    innova_hycross:{
        L:9.16,
        W:3.15,
        roof:3.10,
        body:1.58,
        hood:1.54,
        frontCabin:1.28,
        rearCabin:-1.95,
        wheelR:.77,
        frontWheel:2.58,
        rearWheel:-2.59,
        style:"hycross"
    }
};


/* =========================================================
   HELPERS
========================================================= */

function rand(a,b){
    return a + Math.random()*(b-a);
}

function choose(parts){

    let total=0;

    for(const part of parts)
        total+=part.weight;

    let r=Math.random()*total;

    for(const part of parts){

        r-=part.weight;

        if(r<=0)
            return part;
    }

    return parts[parts.length-1];
}

function putPoint(a,i,x,y,z){

    const n=i*3;

    a[n]=x;
    a[n+1]=y;
    a[n+2]=z;
}

function putColor(a,i,c){

    const n=i*3;

    a[n]=c[0];
    a[n+1]=c[1];
    a[n+2]=c[2];
}


/* =========================================================
   VEHICLE PROFILE
========================================================= */

function roofAt(x,p){

    if(x>p.frontCabin)
        return p.hood;

    if(x>=p.rearCabin){

        const center=
            (p.frontCabin+p.rearCabin)/2;

        const half=
            (p.frontCabin-p.rearCabin)/2;

        const d=
            Math.abs(x-center)/half;

        if(
            p.style==="fortuner" ||
            p.style==="legender" ||
            p.style==="lc300"
        ){
            return p.roof-d*.08;
        }

        if(p.style==="hycross")
            return p.roof-d*.15;

        return p.roof-d*.07;
    }

    const t=
        (x+p.L/2)/
        (p.rearCabin+p.L/2);

    if(p.style==="crysta")
        return 1.32+t*(p.roof-1.32);

    if(p.style==="hycross")
        return 1.18+t*(p.roof-1.18);

    return 1.26+t*(p.roof-1.26);
}

function silhouette(x,p){

    const front=p.L/2;
    const rear=-p.L/2;

    if(x>front-.28)
        return .78;

    if(x>p.frontCabin)
        return p.hood;

    if(x>=p.rearCabin)
        return roofAt(x,p);

    const t=
        (x-rear)/
        (p.rearCabin-rear);

    if(
        p.style==="fortuner" ||
        p.style==="legender" ||
        p.style==="lc300"
    ){
        return 1.10+t*(p.roof-1.10);
    }

    if(p.style==="crysta")
        return 1.20+t*(p.roof-1.20);

    return 1.08+t*(p.roof-1.08);
}


/* =========================================================
   PARTICLE SOURCES
========================================================= */

function bodyPoint(p){

    const x=rand(-p.L/2,p.L/2);
    const top=silhouette(x,p);
    const w=p.W/2;

    const r=Math.random();

    let y,z;

    if(r<.48){

        z=Math.random()<.5?-w:w;

        y=rand(
            .58,
            Math.min(
                top-.06,
                p.body
            )
        );

    }else if(r<.64){

        z=
            Math.random()<.5
            ? -w*.92
            : w*.92;

        y=
            rand(
                p.body*.82,
                top
            );

    }else if(r<.81){

        y=top;
        z=rand(-w*.84,w*.84);

    }else if(x>p.frontCabin){

        y=top;
        z=rand(-w*.78,w*.78);

    }else{

        y=rand(.56,.83);
        z=rand(-w*.92,w*.92);
    }

    return {x,y,z};
}

function windowPoint(p){

    const side=
        Math.random()<.5?-1:1;

    const z=
        side*(p.W/2+.028);

    const front=
        Math.random()<.45;

    const x=
        front
        ? rand(p.frontCabin-.04,-.12)
        : rand(.08,p.rearCabin+.28);

    return {
        x,
        y:rand(
            p.body+.12,
            roofAt(x,p)-.11
        ),
        z
    };
}

function wheelPoint(p){

    const x=
        Math.random()<.5
        ? p.frontWheel
        : p.rearWheel;

    const side=
        Math.random()<.5?-1:1;

    const r=p.wheelR;
    const a=Math.random()*Math.PI*2;
    const rr=r*Math.sqrt(Math.random());

    return {
        x:x+Math.cos(a)*rr,
        y:r+Math.sin(a)*rr,
        z:side*(p.W/2+.10)+rand(-.15,.15)
    };
}

function archPoint(p){

    const x=
        Math.random()<.5
        ? p.frontWheel
        : p.rearWheel;

    const side=
        Math.random()<.5?-1:1;

    const r=p.wheelR*1.10;
    const a=Math.random()*Math.PI;

    return {
        x:x+Math.cos(a)*r,
        y:p.wheelR+Math.sin(a)*r,
        z:side*(p.W/2+.13)
    };
}

function pillarPoint(p){

    const side=
        Math.random()<.5?-1:1;

    const q=Math.random();

    let x;

    if(q<.33)
        x=p.frontCabin-.08;
    else if(q<.66)
        x=0;
    else
        x=p.rearCabin+.04;

    return {
        x:x+rand(-.04,.04),
        y:rand(p.body+.07,roofAt(x,p)),
        z:side*(p.W/2+.047)
    };
}

function skirtPoint(p){

    const side=
        Math.random()<.5?-1:1;

    return {
        x:rand(-p.L*.38,p.L*.30),
        y:rand(.49,.62),
        z:side*(p.W/2+.055)
    };
}

function trimPoint(p){

    const side=
        Math.random()<.5?-1:1;

    const x=
        rand(
            p.rearCabin+.10,
            p.frontCabin-.05
        );

    return {
        x,
        y:roofAt(x,p)+.035,
        z:side*(p.W*.39)
    };
}

function grillePoint(p){

    let width=.68;
    let height=.58;

    if(p.style==="legender"){
        width=.76;
        height=.61;
    }

    if(p.style==="lc300"){
        width=.78;
        height=.78;
    }

    if(p.style==="crysta"){
        width=.70;
        height=.60;
    }

    if(p.style==="hycross"){
        width=.72;
        height=.62;
    }

    const z=
        rand(
            -p.W*width/2,
            p.W*width/2
        );

    const edge=
        Math.abs(z)/
        (p.W*width/2);

    return {
        x:p.L/2+.045,
        y:.78+rand(.02,height)+edge*.04,
        z
    };
}

function bumperPoint(p){

    return {
        x:p.L/2+.055,
        y:rand(.45,.79),
        z:rand(-p.W*.46,p.W*.46)
    };
}

function headlightPoint(p){

    const side=
        Math.random()<.5?-1:1;

    let low=1.29;
    let high=1.53;

    if(p.style==="legender"){
        low=1.31;
        high=1.58;
    }

    if(p.style==="lc300"){
        low=1.38;
        high=1.66;
    }

    return {
        x:p.L/2+.085,
        y:rand(low,high),
        z:side*rand(p.W*.27,p.W*.45)
    };
}

function indicatorPoint(p){

    const front=
        Math.random()<.75;

    if(front){

        const side=
            Math.random()<.5?-1:1;

        return {
            x:p.L/2+.105,
            y:rand(1.07,1.35),
            z:side*rand(p.W*.31,p.W*.46)
        };
    }

    const side=
        Math.random()<.5?-1:1;

    return {
        x:p.frontWheel+.20,
        y:1.31,
        z:side*(p.W/2+.07)
    };
}

function rearLampPoint(p){

    const side=
        Math.random()<.5?-1:1;

    return {
        x:-p.L/2-.045,
        y:rand(
            p.style==="hycross"?1.10:1.04,
            p.style==="hycross"?1.47:1.43
        ),
        z:side*rand(p.W*.30,p.W*.47)
    };
}

function badgePoint(p){

    return {
        x:p.L/2+.11,
        y:1.08+rand(-.08,.08),
        z:rand(-.14,.14)
    };
}

function hubPoint(p){

    const x=
        Math.random()<.5
        ? p.frontWheel
        : p.rearWheel;

    const side=
        Math.random()<.5?-1:1;

    const r=p.wheelR*.36;
    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*r;

    return {
        x:x+Math.cos(a)*rr,
        y:p.wheelR+Math.sin(a)*rr,
        z:side*(p.W/2+.17)
    };
}


/* =========================================================
   PART MIX
========================================================= */

function partsFor(p){

    const parts=[
        {name:"body",weight:50,color:AQUA},
        {name:"window",weight:13,color:BLACK},
        {name:"wheel",weight:10,color:BLACK},
        {name:"arch",weight:4,color:BLACK},
        {name:"grille",weight:6,color:BLACK},
        {name:"bumper",weight:3,color:BLACK},
        {name:"pillar",weight:4,color:BLACK},
        {name:"skirt",weight:2,color:BLACK},
        {name:"trim",weight:1,color:BLACK},
        {name:"headlight",weight:2,color:BLACK},
        {name:"indicator",weight:1.5,color:YELLOW},
        {name:"rear",weight:1.2,color:BLACK},
        {name:"badge",weight:.5,color:BLACK},
        {name:"hub",weight:1.3,color:BLACK}
    ];

    if(p.style==="legender"){

        parts.find(x=>x.name==="grille").weight=8;
        parts.find(x=>x.name==="headlight").weight=3;
        parts.find(x=>x.name==="indicator").weight=2;
    }

    if(p.style==="lc300"){

        parts.find(x=>x.name==="grille").weight=9;
        parts.find(x=>x.name==="body").weight=48;
    }

    if(
        p.style==="crysta" ||
        p.style==="hycross"
    ){

        parts.find(x=>x.name==="window").weight=15;
        parts.find(x=>x.name==="body").weight=49;
    }

    return parts;
}

function makeParticle(part,p){

    switch(part.name){

        case "body":
            return bodyPoint(p);

        case "window":
            return windowPoint(p);

        case "wheel":
            return wheelPoint(p);

        case "arch":
            return archPoint(p);

        case "grille":
            return grillePoint(p);

        case "bumper":
            return bumperPoint(p);

        case "pillar":
            return pillarPoint(p);

        case "skirt":
            return skirtPoint(p);

        case "trim":
            return trimPoint(p);

        case "headlight":
            return headlightPoint(p);

        case "indicator":
            return indicatorPoint(p);

        case "rear":
            return rearLampPoint(p);

        case "badge":
            return badgePoint(p);

        case "hub":
            return hubPoint(p);

        default:
            return bodyPoint(p);
    }
}


/* =========================================================
   WEBGL CONTEXT
========================================================= */

function createCompatibleRenderer(){

    const canvas =
        document.createElement(
            "canvas"
        );

    let gl=null;

    /*
       WebGL 1 FIRST.
       This is the broad compatibility path.
    */

    const attributes={
        alpha:false,
        antialias:false,
        depth:true,
        stencil:false,
        premultipliedAlpha:false,
        preserveDrawingBuffer:false
    };

    try{
        gl=
            canvas.getContext(
                "webgl",
                attributes
            );
    }catch(e){}

    if(!gl){

        try{
            gl=
                canvas.getContext(
                    "experimental-webgl",
                    attributes
                );
        }catch(e){}
    }

    /*
       WebGL 2 second.
    */

    if(!gl){

        try{
            gl=
                canvas.getContext(
                    "webgl2",
                    attributes
                );
        }catch(e){}
    }

    /*
       Context genuinely unavailable.
    */

    if(!gl){
        return null;
    }

    try{

        const r=
            new THREE.WebGLRenderer({
                canvas,
                context:gl,
                antialias:false,
                alpha:false,
                powerPreference:"default",
                precision:"mediump"
            });

        r.setPixelRatio(
            Math.min(
                window.devicePixelRatio||1,
                mobile?1.5:2
            )
        );

        r.setSize(
            container.clientWidth,
            container.clientHeight,
            false
        );

        r.setClearColor(
            0x1a1a1a,
            1
        );

        return r;

    }catch(error){

        /*
           If Three.js cannot use that context,
           release it and use Canvas 2D.
        */

        console.warn(
            "Three.js could not use WebGL:",
            error
        );

        return null;
    }
}


/* =========================================================
   THREE INITIALIZATION
========================================================= */

function initThree(){

    renderer=
        createCompatibleRenderer();

    if(!renderer){
        return false;
    }

    scene=
        new THREE.Scene();


    camera=
        new THREE.PerspectiveCamera(
            55,
            container.clientWidth/
            Math.max(
                container.clientHeight,
                1
            ),
            .1,
            300
        );


    camera.position.set(
        15.7,
        6.6,
        18.2
    );


    camera.lookAt(
        .25,
        1.3,
        0
    );


    controls=
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping=true;
    controls.dampingFactor=.065;

    controls.enablePan=false;

    controls.minDistance=7;
    controls.maxDistance=38;

    controls.rotateSpeed=.75;
    controls.zoomSpeed=.8;

    controls.target.set(
        .25,
        1.3,
        0
    );


    currentPositions=
        new Float32Array(
            PARTICLE_COUNT*3
        );

    currentColors=
        new Float32Array(
            PARTICLE_COUNT*3
        );

    targetPositions=
        new Float32Array(
            PARTICLE_COUNT*3
        );

    targetColors=
        new Float32Array(
            PARTICLE_COUNT*3
        );


    /*
       Initial 100×100×100 cloud.
    */

    for(
        let i=0;
        i<PARTICLE_COUNT;
        i++
    ){

        const n=i*3;

        currentPositions[n]=
            rand(
                -50,
                50
            );

        currentPositions[n+1]=
            rand(
                -50,
                50
            );

        currentPositions[n+2]=
            rand(
                -50,
                50
            );

        currentColors[n]=AQUA[0];
        currentColors[n+1]=AQUA[1];
        currentColors[n+2]=AQUA[2];
    }


    targetPositions.set(
        currentPositions
    );

    targetColors.set(
        currentColors
    );


    geometry=
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            currentPositions,
            3
        )
    );


    geometry.setAttribute(
        "nextPosition",
        new THREE.BufferAttribute(
            targetPositions,
            3
        )
    );


    geometry.setAttribute(
        "aColor",
        new THREE.BufferAttribute(
            currentColors,
            3
        )
    );


    geometry.setAttribute(
        "nextColor",
        new THREE.BufferAttribute(
            targetColors,
            3
        )
    );


    material=
        new THREE.ShaderMaterial({

            uniforms:{

                uTime:{value:0},

                uMorph:{value:0},

                uWhite:{value:0},

                uDrift:{value:1},

                uPixelRatio:{
                    value:
                        Math.min(
                            window.devicePixelRatio||1,
                            mobile?1.5:2
                        )
                },

                uViewportHeight:{
                    value:
                        container.clientHeight
                },

                uPointer:{
                    value:
                        new THREE.Vector2(
                            10,
                            10
                        )
                }
            },


            vertexShader:`

uniform float uTime;
uniform float uMorph;
uniform float uDrift;
uniform float uPixelRatio;
uniform float uViewportHeight;
uniform vec2 uPointer;

attribute vec3 nextPosition;
attribute vec3 aColor;
attribute vec3 nextColor;

varying vec3 vColor;

void main(){

    vColor = mix(
        aColor,
        nextColor,
        uMorph
    );

    vec3 target =
        mix(
            position,
            nextPosition,
            uMorph
        );


    /*
       Foam drift.
    */

    vec3 s=position;

    float t=uTime;

    vec3 drift=vec3(

        sin(
            s.x*.37+
            s.y*.13+
            t*1.11
        )+
        .42*sin(
            s.z*.21-
            t*.73
        ),

        sin(
            s.y*.29+
            s.z*.17-
            t*.91
        )+
        .38*sin(
            s.x*.19+
            t*.61
        ),

        sin(
            s.z*.31+
            s.x*.11+
            t*.83
        )+
        .34*sin(
            s.y*.23-
            t*.49
        )
    );


    target+=
        drift*
        .055*
        uDrift*
        (1.0-uMorph);


    /*
       Small air bubble.

       MUCH smaller than the previous effect.
    */

    vec4 clip=
        projectionMatrix*
        modelViewMatrix*
        vec4(
            target,
            1.0
        );


    vec2 screen=
        clip.xy/
        max(
            abs(clip.w),
            .0001
        );


    vec2 delta=
        screen-uPointer;


    float distanceToBubble=
        length(
            delta
        );


    float bubbleRadius=.095;


    float bubbleForce=
        smoothstep(
            bubbleRadius,
            0.0,
            distanceToBubble
        );


    bubbleForce*=
        .10*
        uDrift*
        (1.0-uMorph);


    if(
        distanceToBubble>.0001 &&
        distanceToBubble<bubbleRadius
    ){

        target+=
            normalize(delta)*
            bubbleForce;
    }


    vec4 mv=
        modelViewMatrix*
        vec4(
            target,
            1.0
        );


    gl_Position=
        projectionMatrix*
        mv;


    float size=
        4.2*
        (
            uViewportHeight/
            1080.0
        )*
        uPixelRatio;


    gl_PointSize=
        clamp(
            size,
            3.0,
            8.0
        );
}
`,

            fragmentShader:`

uniform float uWhite;
uniform float uMorph;

varying vec3 vColor;

void main(){

    float d=
        distance(
            gl_PointCoord,
            vec2(.5,.5)
        );


    if(d>.5)
        discard;


    vec3 color=
        mix(
            vColor,
            vec3(
                1.0,
                1.0,
                1.0
            ),
            uWhite
        );


    /*
       Initial cloud has black edge.
    */

    if(
        uMorph<.5 &&
        uWhite<.8
    ){

        if(d>.34){

            gl_FragColor=
                vec4(
                    0.0,
                    0.0,
                    0.0,
                    1.0
                );

        }else{

            float core=
                smoothstep(
                    .34,
                    .025,
                    d
                );

            gl_FragColor=
                vec4(
                    color,
                    max(
                        core,
                        .94
                    )
                );
        }

    }else{

        float alpha=
            smoothstep(
                .5,
                .07,
                d
            );

        gl_FragColor=
            vec4(
                color,
                max(
                    alpha,
                    .97
                )
            );
    }
}
`,

            transparent:true,

            depthWrite:false,

            depthTest:true,

            blending:
                THREE.NormalBlending
        });


    particles=
        new THREE.Points(
            geometry,
            material
        );


    scene.add(
        particles
    );


    /*
       Pointer bubble.
    */

    renderer.domElement.addEventListener(
        "pointermove",
        e=>{

            const r=
                renderer
                .domElement
                .getBoundingClientRect();

            const x=
                (
                    (e.clientX-r.left)/
                    r.width
                )*2-1;

            const y=
                -(
                    (
                        (e.clientY-r.top)/
                        r.height
                    )*2-1
                );

            material
                .uniforms
                .uPointer
                .value
                .set(
                    x,
                    y
                );
        }
    );


    renderer.domElement.addEventListener(
        "pointerleave",
        ()=>{

            material
                .uniforms
                .uPointer
                .value
                .set(
                    10,
                    10
                );
        }
    );


    container.insertBefore(
        renderer.domElement,
        container.firstChild
    );


    mode="webgl";

    return true;
}


/* =========================================================
   FALLBACK 3D CANVAS
========================================================= */

let fbPos;
let fbTarget;
let fbColor;
let fbTargetColor;

let fbMorph=0;

let fbYaw=.0;
let fbPitch=.10;
let fbZoom=1;

let dragging=false;
let lastX=0;
let lastY=0;

function resizeFallback(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    fallbackCanvas.width=
        Math.max(
            1,
            Math.floor(
                container.clientWidth*dpr
            )
        );

    fallbackCanvas.height=
        Math.max(
            1,
            Math.floor(
                container.clientHeight*dpr
            )
        );

    fallbackCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

function initFallback(){

    fallbackCanvas.style.display="block";

    resizeFallback();

    fbPos=
        new Float32Array(
            FALLBACK_COUNT*3
        );

    fbTarget=
        new Float32Array(
            FALLBACK_COUNT*3
        );

    fbColor=
        new Float32Array(
            FALLBACK_COUNT*3
        );

    fbTargetColor=
        new Float32Array(
            FALLBACK_COUNT*3
        );


    for(
        let i=0;
        i<FALLBACK_COUNT;
        i++
    ){

        const n=i*3;

        fbPos[n]=rand(-50,50);
        fbPos[n+1]=rand(-50,50);
        fbPos[n+2]=rand(-50,50);

        fbColor[n]=AQUA[0];
        fbColor[n+1]=AQUA[1];
        fbColor[n+2]=AQUA[2];
    }


    fbTarget.set(fbPos);
    fbTargetColor.set(fbColor);


    fallbackCanvas.addEventListener(
        "pointerdown",
        e=>{

            dragging=true;

            lastX=e.clientX;
            lastY=e.clientY;
        }
    );


    window.addEventListener(
        "pointermove",
        e=>{

            if(!dragging)
                return;

            const dx=
                e.clientX-lastX;

            const dy=
                e.clientY-lastY;

            fbYaw+=dx*.008;
            fbPitch+=dy*.006;

            fbPitch=
                Math.max(
                    -.9,
                    Math.min(
                        .9,
                        fbPitch
                    )
                );

            lastX=e.clientX;
            lastY=e.clientY;
        }
    );


    window.addEventListener(
        "pointerup",
        ()=>{

            dragging=false;
        }
    );


    fallbackCanvas.addEventListener(
        "wheel",
        e=>{

            e.preventDefault();

            fbZoom*=
                e.deltaY>0
                ? .92
                : 1.08;

            fbZoom=
                Math.max(
                    .55,
                    Math.min(
                        2.0,
                        fbZoom
                    )
                );
        },
        {passive:false}
    );


    fallbackCanvas.addEventListener(
        "touchmove",
        e=>{

            if(
                e.touches.length===1 &&
                dragging
            ){

                const t=e.touches[0];

                const dx=
                    t.clientX-lastX;

                const dy=
                    t.clientY-lastY;

                fbYaw+=dx*.008;
                fbPitch+=dy*.006;

                fbPitch=
                    Math.max(
                        -.9,
                        Math.min(
                            .9,
                            fbPitch
                        )
                    );

                lastX=t.clientX;
                lastY=t.clientY;
            }
        },
        {passive:false}
    );


    mode="fallback";

    requestAnimationFrame(
        fallbackAnimate
    );
}


function rotateFB(x,y,z){

    const cy=Math.cos(fbYaw);
    const sy=Math.sin(fbYaw);

    const cx=Math.cos(fbPitch);
    const sx=Math.sin(fbPitch);


    const x1=
        x*cy+z*sy;

    const z1=
        -x*sy+z*cy;

    const y1=
        y*cx-z1*sx;

    const z2=
        y*sx+z1*cx;


    return {
        x:x1,
        y:y1,
        z:z2
    };
}


function fallbackAnimate(){

    if(mode!=="fallback")
        return;

    requestAnimationFrame(
        fallbackAnimate
    );


    const ctx=fallbackCtx;

    const w=
        container.clientWidth;

    const h=
        container.clientHeight;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    const time=
        performance.now()*.001;


    const scale=
        Math.min(
            w/14,
            h/7
        )*
        fbZoom;


    for(
        let i=0;
        i<FALLBACK_COUNT;
        i++
    ){

        const n=i*3;

        let x=fbPos[n];
        let y=fbPos[n+1];
        let z=fbPos[n+2];


        x+=
            (
                fbTarget[n]-
                x
            )*
            fbMorph;

        y+=
            (
                fbTarget[n+1]-
                y
            )*
            fbMorph;

        z+=
            (
                fbTarget[n+2]-
                z
            )*
            fbMorph;


        /*
           Only the initial cloud moves.
        */

        if(
            !currentModel &&
            !generating
        ){

            x+=
                (
                    Math.sin(
                        x*.37+
                        y*.13+
                        time*1.1
                    )
                )*.10;

            y+=
                (
                    Math.sin(
                        y*.29+
                        z*.17-
                        time*.91
                    )
                )*.10;

            z+=
                (
                    Math.sin(
                        z*.31+
                        x*.11+
                        time*.83
                    )
                )*.10;
        }


        const p=
            rotateFB(
                x,
                y,
                z
            );


        const depth=
            1+
            p.z*.012;


        if(depth<.1)
            continue;


        const sx=
            w/2+
            p.x*
            scale*
            depth;

        const sy=
            h*.57-
            p.y*
            scale*
            depth;


        const size=
            Math.max(
                1,
                Math.min(
                    2.5,
                    1.4*depth
                )
            );


        const cr=fbColor[n];
        const cg=fbColor[n+1];
        const cb=fbColor[n+2];


        /*
           Black outer rim in cloud.
        */

        if(
            fbMorph<.5
        ){

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                size*1.7,
                0,
                Math.PI*2
            );

            ctx.fillStyle="#000";

            ctx.fill();
        }


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            size,
            0,
            Math.PI*2
        );


        let color="#00ffff";


        if(
            cr===0 &&
            cg===0 &&
            cb===0
        ){
            color="#000";
        }


        if(
            cr===1 &&
            cg>.5 &&
            cb===0
        ){
            color="rgb(255,178,0)";
        }


        /*
           White stage.
        */

        if(whiteStage)
            color="#fff";


        ctx.fillStyle=color;

        ctx.fill();
    }


    /*
       Fallback morph animation.
    */

    if(morphing){

        const elapsed=
            performance.now()-
            morphStart;

        const raw=
            Math.min(
                elapsed/
                MORPH_DURATION,
                1
            );

        fbMorph=
            raw<.5
            ?4*raw*raw*raw
            :1-
             Math.pow(
                 -2*raw+2,
                 3
             )/2;


        const p=
            Math.floor(
                raw*100
            );


        progressFill.style.width=
            p+"%";

        percentage.textContent=
            p+"%";


        if(raw>=1){

            morphing=false;

            fbPos.set(
                fbTarget
            );

            fbColor.set(
                fbTargetColor
            );

            fbMorph=0;

            progressFill.style.width=
                "100%";

            percentage.textContent=
                "100%";


            setTimeout(
                ()=>{
                    loading.style.display=
                        "none";
                },
                200
            );
        }
    }


    /*
       White stage.
    */

    if(whiteStage){

        const raw=
            Math.min(
                (
                    performance.now()-
                    whiteStart
                )/
                WHITE_DURATION,
                1
            );


        if(raw>=1){

            whiteStage=false;

            morphing=true;

            morphStart=
                performance.now();

            fbMorph=0;
        }
    }
}


/* =========================================================
   GENERATION
========================================================= */

function generateModel(
    model,
    done
){

    const p=CARS[model];

    const count=
        mode==="webgl"
        ? PARTICLE_COUNT
        : FALLBACK_COUNT;

    const pos=
        new Float32Array(
            count*3
        );

    const col=
        new Float32Array(
            count*3
        );

    const parts=
        partsFor(p);

    let finished=0;

    const chunk=
        mode==="webgl"
        ? 1200
        : 500;


    function process(){

        const end=
            Math.min(
                finished+chunk,
                count
            );


        for(
            let i=finished;
            i<end;
            i++
        ){

            const part=
                choose(parts);

            const point=
                makeParticle(
                    part,
                    p
                );

            putPoint(
                pos,
                i,
                point.x,
                point.y,
                point.z
            );

            putColor(
                col,
                i,
                part.color
            );
        }


        finished=end;


        const p=
            Math.floor(
                finished/count*100
            );


        progressFill.style.width=
            p+"%";

        percentage.textContent=
            p+"%";


        if(finished<count){

            requestAnimationFrame(
                process
            );

        }else{

            cache[model]={
                positions:pos,
                colors:col
            };

            done(
                cache[model]
            );
        }
    }


    requestAnimationFrame(
        process
    );
}


/* =========================================================
   BEGIN CAR
========================================================= */

function beginCar(
    model,
    data
){

    currentModel=model;


    if(mode==="webgl"){

        geometry
            .getAttribute(
                "nextPosition"
            )
            .array
            .set(
                data.positions
            );

        geometry
            .getAttribute(
                "nextPosition"
            )
            .needsUpdate=true;


        geometry
            .getAttribute(
                "nextColor"
            )
            .array
            .set(
                data.colors
            );

        geometry
            .getAttribute(
                "nextColor"
            )
            .needsUpdate=true;


        material
            .uniforms
            .uDrift
            .value=0;

        material
            .uniforms
            .uMorph
            .value=0;

        material
            .uniforms
            .uWhite
            .value=0;


    }else{

        fbTarget.set(
            data.positions
        );

        fbTargetColor.set(
            data.colors
        );

        fbMorph=0;


        if(
            !firstSeen[model]
        ){

            firstSeen[model]=true;

            whiteStage=true;

            whiteStart=
                performance.now();

        }else{

            morphing=true;

            morphStart=
                performance.now();
        }

        return;
    }


    if(
        !firstSeen[model]
    ){

        firstSeen[model]=true;

        whiteStage=true;

        whiteStart=
            performance.now();

    }else{

        startMorph();
    }
}


/* =========================================================
   START MORPH
========================================================= */

function startMorph(){

    whiteStage=false;

    morphing=true;

    morphStart=
        performance.now();


    if(mode==="webgl"){

        material
            .uniforms
            .uWhite
            .value=1;

        material
            .uniforms
            .uMorph
            .value=0;
    }
}


/* =========================================================
   BUTTONS
========================================================= */

buttons.forEach(
    button=>{

        button.addEventListener(
            "click",
            ()=>{

                if(
                    generating ||
                    morphing ||
                    whiteStage
                ){
                    return;
                }


                buttons.forEach(
                    b=>
                        b.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                const model=
                    button.dataset.car;


                generating=true;


                loading.style.display=
                    "flex";


                progressFill.style.width=
                    "0%";


                percentage.textContent=
                    "0%";


                buttons.forEach(
                    b=>
                        b.disabled=true
                );


                if(
                    cache[model]
                ){

                    requestAnimationFrame(
                        ()=>{

                            generating=false;

                            buttons.forEach(
                                b=>
                                    b.disabled=false
                            );


                            beginCar(
                                model,
                                cache[model]
                            );
                        }
                    );

                }else{

                    generateModel(
                        model,
                        data=>{

                            generating=false;

                            buttons.forEach(
                                b=>
                                    b.disabled=false
                            );


                            beginCar(
                                model,
                                data
                            );
                        }
                    );
                }
            }
        );
    }
);


/* =========================================================
   WEBGL ANIMATION
========================================================= */

function animateWebGL(){

    requestAnimationFrame(
        animateWebGL
    );


    const now=
        performance.now();


    material
        .uniforms
        .uTime
        .value=
            (
                now-
                appStart
            )/
            1000;


    /*
       White stage.
    */

    if(whiteStage){

        const raw=
            Math.min(
                (
                    now-
                    whiteStart
                )/
                WHITE_DURATION,
                1
            );


        const smooth=
            raw*raw*
            (3-2*raw);


        material
            .uniforms
            .uWhite
            .value=
                smooth;


        if(raw>=1)
            startMorph();
    }


    /*
       Morph.
    */

    if(morphing){

        const raw=
            Math.min(
                (
                    now-
                    morphStart
                )/
                MORPH_DURATION,
                1
            );


        const eased=
            raw<.5
            ?4*raw*raw*raw
            :1-
             Math.pow(
                 -2*raw+2,
                 3
             )/2;


        material
            .uniforms
            .uMorph
            .value=
                eased;


        material
            .uniforms
            .uWhite
            .value=
                Math.max(
                    0,
                    1-
                    raw/.38
                );


        const p=
            Math.floor(
                raw*100
            );


        progressFill.style.width=
            p+"%";

        percentage.textContent=
            p+"%";


        if(raw>=1){

            morphing=false;


            /*
               Lock final particle positions.
            */

            const position=
                geometry
                .getAttribute(
                    "position"
                );

            position
                .array
                .set(
                    geometry
                    .getAttribute(
                        "nextPosition"
                    ).array
                );

            position.needsUpdate=true;


            const color=
                geometry
                .getAttribute(
                    "aColor"
                );

            color
                .array
                .set(
                    geometry
                    .getAttribute(
                        "nextColor"
                    ).array
                );

            color.needsUpdate=true;


            material
                .uniforms
                .uMorph
                .value=0;

            material
                .uniforms
                .uWhite
                .value=0;


            /*
               FINAL FREEZE.
            */

            material
                .uniforms
                .uDrift
                .value=0;


            material
                .uniforms
                .uPointer
                .value
                .set(
                    10,
                    10
                );


            progressFill.style.width=
                "100%";

            percentage.textContent=
                "100%";


            setTimeout(
                ()=>{
                    loading.style.display=
                        "none";
                },
                200
            );
        }
    }


    /*
       Only initial cloud has automatic movement.
    */

    if(
        !currentModel &&
        !generating
    ){

        particles.rotation.y=
            Math.sin(
                now*.00008
            )*.03;

        particles.rotation.x=
            Math.sin(
                now*.00005
            )*.015;

    }else{

        particles.rotation.y=0;
        particles.rotation.x=0;
    }


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(mode==="webgl"){

            const w=
                container.clientWidth;

            const h=
                Math.max(
                    1,
                    container.clientHeight
                );


            camera.aspect=
                w/h;

            camera.updateProjectionMatrix();


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio||1,
                    mobile?1.5:2
                )
            );


            renderer.setSize(
                w,
                h,
                false
            );


            material
                .uniforms
                .uPixelRatio
                .value=
                    Math.min(
                        window.devicePixelRatio||1,
                        mobile?1.5:2
                    );


            material
                .uniforms
                .uViewportHeight
                .value=
                    h;

        }else if(mode==="fallback"){

            resizeFallback();
        }
    }
);


/* =========================================================
   START ENGINE
========================================================= */

if(
    initThree()
){

    animateWebGL();

}else{

    /*
       NEVER SHOW A WEBGL ERROR PAGE.
       The 2D renderer takes over automatically.
    */

    initFallback();
}

</script>
