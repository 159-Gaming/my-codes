<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Toyota 3D Particle Showcase</title>

    <!-- GitHub-hosted CSS -->
    <link
        rel="stylesheet"
        href="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/styles.css"
    >

    <!-- Three.js -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
    ></script>
</head>

<body>

<aside id="sidebar">

    <h1>Toyota Series</h1>

    <button class="car-btn" data-car="fortuner">
        Toyota Fortuner
    </button>

    <button class="car-btn" data-car="legender">
        Toyota Legender
    </button>

    <button class="car-btn" data-car="lc300">
        Toyota LC300
    </button>

    <button class="car-btn" data-car="innova-crysta">
        Innova Crysta
    </button>

    <button class="car-btn" data-car="innova-hycross">
        Innova HyCross
    </button>

    <div id="sidebar-note">
        Select a vehicle to form the particle sculpture.
    </div>

</aside>


<main id="stage">

    <div id="loading">

        <div id="loading-title">
            FORMING SHAPE...
        </div>

        <div id="progress-row">

            <div id="progress-track">
                <div id="progress-fill"></div>
            </div>

            <span id="progress-number">
                0%
            </span>

        </div>

    </div>


    <div id="mobile-help">
        Drag to rotate • pinch to zoom
    </div>


    <a
        id="github-link"
        href="https://github.com/159-Gaming/my-codes/tree/main/Ai%20genrated"
        target="_blank"
        rel="noopener noreferrer"
    >
        GitHub Source
    </a>

</main>


<!-- ======================================================
     COMMON ENGINE FIRST

     initial.js only defines tools and waits for window.load
     before starting the app.

     Therefore the five vehicle modules below are guaranteed
     to be registered before the engine starts.
====================================================== -->

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/initial.js"
></script>


<!-- ======================================================
     FIVE FIXED VEHICLE MODULES
====================================================== -->

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/fortuner.js"
></script>

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/legender.js"
></script>

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/lc300.js"
></script>

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/innova-crysta.js"
></script>

<script
    src="https://raw.githubusercontent.com/159-Gaming/my-codes/main/Ai%20genrated/innova-hycross.js"
></script>

</body>
</html>
